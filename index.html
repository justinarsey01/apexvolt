<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoForge - Invest Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .hero-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }
        
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #fbbf24;
            transition: width 0.3s ease;
        }
        
        .nav-link:hover:after {
            width: 100%;
        }

        /* Custom breakpoint for 500px */
        @media (max-width: 500px) {
            .desktop-menu {
                display: none !important;
            }
            .mobile-menu-button {
                display: flex !important;
            }
        }
    </style>
</head>
<body class="bg-gray-950 text-white overflow-x-hidden">
    <!-- Navbar -->
    <nav class="bg-black border-b border-gray-800 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-coins text-black text-xl"></i>
                    </div>
                    <span class="font-bold text-2xl tracking-tighter">CryptoForge</span>
                </div>

                <!-- Desktop Menu - Hidden below 500px -->
                <div class="desktop-menu hidden md:flex items-center space-x-8">
                    <a href="#" class="nav-link text-gray-300 hover:text-white font-medium">Home</a>
                    <a href="dashboard.html" class="nav-link text-gray-300 hover:text-white font-medium">Dashboard</a>
                    <a href="referrals.html" class="nav-link text-gray-300 hover:text-white font-medium">Referrals</a>
                </div>

                <!-- Desktop Auth Buttons -->
                <div class="desktop-menu hidden md:flex items-center space-x-3">
                    <button onclick="showLoginModal()" 
                            class="px-6 py-2.5 bg-white text-black rounded-2xl font-semibold hover:bg-yellow-400 transition-all active:scale-95">
                        Login
                    </button>
                    <button onclick="register()" 
                            class="px-6 py-2.5 border border-white/70 hover:border-white rounded-2xl font-semibold hover:bg-white hover:text-black transition-all active:scale-95">
                        Sign Up
                    </button>
                </div>

                <!-- Mobile Menu Button - Shown below 500px -->
                <button id="mobile-menu-btn" 
                        class="mobile-menu-button hidden items-center justify-center w-10 h-10 text-2xl focus:outline-none">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden bg-black border-t border-gray-800">
            <div class="px-6 py-8 space-y-6">
                <div class="flex flex-col space-y-6 text-center">
                    <a href="#" onclick="toggleMobileMenu()" class="text-xl font-medium text-gray-300 hover:text-white">Home</a>
                    <a href="dashboard.html" onclick="toggleMobileMenu()" class="text-xl font-medium text-gray-300 hover:text-white">Dashboard</a>
                    <a href="referrals.html" onclick="toggleMobileMenu()" class="text-xl font-medium text-gray-300 hover:text-white">Referrals</a>
                </div>
                
                <div class="pt-6 border-t border-gray-800 flex flex-col space-y-4">
                    <button onclick="showLoginModal(); toggleMobileMenu()" 
                            class="w-full py-4 bg-white text-black rounded-2xl font-semibold text-lg">
                        Login
                    </button>
                    <button onclick="register(); toggleMobileMenu()" 
                            class="w-full py-4 border border-white rounded-2xl font-semibold text-lg">
                        Sign Up
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <button id="installBtn" hidden>
  Install App
</button>
    <!-- Hero Section -->
    <section class="pt-20 min-h-screen flex items-center hero-bg relative">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="max-w-3xl mx-auto">
                <h1 class="text-5xl sm:text-6xl md:text-7xl font-bold tracking-tighter leading-tight mb-6">
                    Invest Smart.<br>
                    <span class="bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">Forge Your Future.</span>
                </h1>
                
                <p class="text-xl md:text-2xl text-gray-400 mb-10 max-w-xl mx-auto">
                    The modern crypto investment platform with powerful tools and real returns.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="showLoginModal()" 
                            class="px-10 py-4 bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-3xl text-lg transition-all active:scale-95 shadow-xl shadow-yellow-500/30">
                        Get Started Free
                    </button>
                    <button onclick="window.location.href='dashboard.html'" 
                            class="px-10 py-4 border border-gray-400 hover:border-white rounded-3xl text-lg transition-all">
                        Learn More
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100] px-4">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-auto p-8 relative">
            <button onclick="hideLoginModal()" 
                    class="absolute top-6 right-6 text-3xl text-gray-400 hover:text-white transition-colors">
                ×
            </button>
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-coins text-black text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold">Welcome Back</h2>
                <p class="text-gray-400 mt-2">Sign in to continue to CryptoForge</p>
            </div>
            
            <input id="login-email" type="text" placeholder="Email or Username"
                   class="w-full bg-zinc-800 border border-gray-700 rounded-2xl px-6 py-4 mb-4 focus:outline-none focus:border-yellow-400 text-lg">
            
            <input id="login-password" type="password" placeholder="Password"
                   class="w-full bg-zinc-800 border border-gray-700 rounded-2xl px-6 py-4 mb-6 focus:outline-none focus:border-yellow-400 text-lg">
            
            <button onclick="login()" 
                    class="w-full py-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-bold rounded-2xl text-lg hover:brightness-110 transition-all">
                Sign In
            </button>
            
            <p class="text-center text-sm text-gray-400 mt-8">
                Don't have an account? 
                <a href="dashboard.html" onclick="hideLoginModal(); register()" class="text-yellow-400 hover:text-yellow-300 font-medium">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
            const icon = mobileBtn.querySelector('i');
            if (icon.classList.contains('fa-bars')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        }
        
        mobileBtn.addEventListener('click', toggleMobileMenu);

        // Modal functions
        function showLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-modal').classList.add('flex');
        }
        
        function hideLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function login() {
            alert('Login successful! (Demo)');
            hideLoginModal();
        }
        
        function register() {
            alert('Redirecting to registration... (Demo)');
        }

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") hideLoginModal();
        });

        // Close mobile menu on outside click or resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 500) {
                mobileMenu.classList.add('hidden');
            }
        });


        
    </script>
    <script>
  // Register Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker ready'))
      .catch(err => console.error('Service Worker failed:', err));
  }

  // Install button logic
  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').hidden = false;
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('User choice:', outcome);

    deferredPrompt = null;
    document.getElementById('installBtn').hidden = true;
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('installBtn').hidden = true;
    deferredPrompt = null;
  });
</script>
</body>
</html>
