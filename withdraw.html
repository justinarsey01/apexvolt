<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw - ApexVolt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .logo-gradient { background: linear-gradient(135deg, #3b82f6, #1e40af); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #09090b; border-top: 1px solid #27272a; display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1; height: 100%; color: #71717a; font-size: 11px; font-weight: 500; text-decoration: none; }
        .bottom-nav-item.active { color: #3b82f6; }
        @media (max-width: 1023px) { body { padding-bottom: 80px; } }
        @media (min-width: 1024px) { .bottom-nav { display: none !important; } }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-black border-b border-gray-800 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 logo-gradient rounded-2xl flex items-center justify-center text-white font-bold text-2xl">A</div>
                <span class="font-bold text-2xl">ApexVolt</span>
            </div>
            <button onclick="location.href='dashboard.html'" class="text-sm text-gray-400 hover:text-white">← Dashboard</button>
        </div>
    </nav>

    <div class="pt-24 px-6 max-w-lg mx-auto pb-10">
        <div class="mb-8">
            <h1 class="text-3xl font-bold">Withdraw</h1>
            <p class="text-gray-400 mt-1">Withdraw from your Main Balance</p>
        </div>

        <div class="bg-zinc-900 border border-gray-800 rounded-2xl p-4 mb-6">
            <div class="text-xs text-gray-400 mb-1">Available Main Balance</div>
            <div id="main-balance" class="text-2xl font-mono font-bold">$0</div>
        </div>

        <div class="bg-zinc-900 border border-gray-800 rounded-3xl p-6 mb-6">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-11 h-11 rounded-2xl bg-rose-500/15 flex items-center justify-center">
                    <i class="fas fa-arrow-up text-rose-400"></i>
                </div>
                <div>
                    <h2 class="text-xl font-semibold">Withdraw Funds</h2>
                    <p class="text-sm text-gray-400">Minimum $50 • From Main Balance only</p>
                </div>
            </div>

            <div class="mb-5">
                <label class="text-sm text-gray-400 mb-2 block">Network</label>
                <select id="withdraw-network" class="w-full bg-zinc-950 border border-gray-700 rounded-2xl py-4 px-5 text-white">
                    <option value="">Select network...</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                    <option value="ETH">Ethereum (ETH)</option>
                    <option value="USDT">Tether (USDT)</option>
                    <option value="SOL">Solana (SOL)</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="text-sm text-gray-400 mb-2 block">Amount (USD)</label>
                <input id="withdraw-amount" type="number" min="50" placeholder="50.00"
                       class="w-full bg-zinc-950 border border-gray-700 rounded-2xl py-4 px-5 text-white placeholder-gray-500 font-mono">
            </div>

            <div class="mb-6">
                <label class="text-sm text-gray-400 mb-2 block">Wallet Address</label>
                <input id="withdraw-address" type="text" placeholder="Enter wallet address"
                       class="w-full bg-zinc-950 border border-gray-700 rounded-2xl py-4 px-5 text-white placeholder-gray-500 font-mono text-sm">
            </div>

            <button id="withdraw-btn" onclick="submitWithdrawal()"
                    class="w-full py-4 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 rounded-2xl font-semibold flex items-center justify-center gap-3 disabled:opacity-60">
                <svg id="withdraw-spinner" class="hidden animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="withdraw-btn-text">Confirm Withdrawal</span>
            </button>
        </div>

        <div class="bg-zinc-900 border border-gray-800 rounded-3xl p-6">
            <h3 class="text-lg font-semibold mb-4">Withdrawal History</h3>
            <div id="withdraw-history"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="invest.html" class="bottom-nav-item"><i class="fas fa-chart-bar"></i><span>Invest</span></a>
        <a href="deposit.html" class="bottom-nav-item"><i class="fas fa-arrow-down"></i><span>Deposit</span></a>
        <a href="withdraw.html" class="bottom-nav-item active"><i class="fas fa-arrow-up"></i><span>Withdraw</span></a>
        <a href="account.html" class="bottom-nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </nav>

    <script>
        function getBalances() {
            const data = JSON.parse(localStorage.getItem('apexvolt_balances') || '{}');
            return { main: Number(data.main) || 0, investment: Number(data.investment) || 0 };
        }
        function saveBalances(main, investment) {
            localStorage.setItem('apexvolt_balances', JSON.stringify({ main: Number(main), investment: Number(investment) }));
        }

        let withdrawHistory = JSON.parse(localStorage.getItem('apexvolt_withdrawals') || '[]');

        function updateBalanceDisplay() {
            document.getElementById('main-balance').textContent = '$' + getBalances().main.toLocaleString();
        }

        function submitWithdrawal() {
            const network = document.getElementById('withdraw-network').value;
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            const address = document.getElementById('withdraw-address').value.trim();
            const btn = document.getElementById('withdraw-btn');
            const spinner = document.getElementById('withdraw-spinner');
            const btnText = document.getElementById('withdraw-btn-text');

            if (!network) return alert('Please select a network');
            if (!amount || amount < 50) return alert('Minimum withdrawal is $50');
            if (!address || address.length < 10) return alert('Please enter a valid wallet address');

            const balances = getBalances();
            if (amount > balances.main) {
                return alert('Insufficient Main Balance');
            }

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'Processing...';

            setTimeout(() => {
                balances.main -= amount;
                saveBalances(balances.main, balances.investment);

                withdrawHistory.unshift({
                    network: network,
                    amount: amount,
                    address: address,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    status: 'Pending'
                });
                localStorage.setItem('apexvolt_withdrawals', JSON.stringify(withdrawHistory));

                document.getElementById('withdraw-network').value = '';
                document.getElementById('withdraw-amount').value = '';
                document.getElementById('withdraw-address').value = '';
                updateBalanceDisplay();
                renderWithdrawHistory();

                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'Confirm Withdrawal';

                alert('Withdrawal request of $' + amount.toLocaleString() + ' submitted!');
            }, 1200);
        }

        function renderWithdrawHistory() {
            const container = document.getElementById('withdraw-history');
            if (withdrawHistory.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500">No withdrawals yet</div>';
                return;
            }
            container.innerHTML = withdrawHistory.map(item => `
                <div class="py-3 border-b border-gray-800">
                    <div class="flex justify-between">
                        <span class="font-medium">${item.network}</span>
                        <span class="font-mono text-rose-400">-$${item.amount.toLocaleString()}</span>
                    </div>
                    <div class="text-sm text-gray-400">${item.date} · ${item.status}</div>
                </div>
            `).join('');
        }

        updateBalanceDisplay();
        renderWithdrawHistory();
    </script>
</body>
</html>
