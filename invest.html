<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <title>Invest - ApexVolt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .logo-gradient { background: linear-gradient(135deg, #3b82f6, #1e40af); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #09090b; border-top: 1px solid #27272a; display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1; height: 100%; color: #71717a; font-size: 11px; font-weight: 500; text-decoration: none; }
        .bottom-nav-item.active { color: #3b82f6; }
        .bottom-nav-item.active i { transform: scale(1.1); }
        @media (max-width: 1023px) { body { padding-bottom: 80px; } }
        @media (min-width: 1024px) { .bottom-nav { display: none !important; } }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-black border-b border-gray-800 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 logo-gradient rounded-2xl flex items-center justify-center text-white font-bold text-2xl">A</div>
                <span class="font-bold text-2xl">ApexVolt</span>
            </div>
            <button onclick="location.href='dashboard.html'" class="text-sm text-gray-400 hover:text-white">← Dashboard</button>
        </div>
    </nav>

    <div class="pt-24 px-6 max-w-lg mx-auto pb-10">
        <div class="mb-8">
            <h1 class="text-3xl font-bold">Invest</h1>
            <p class="text-gray-400 mt-1">Grow your crypto with yield</p>
        </div>

        <!-- Balances Summary -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-zinc-900 border border-gray-800 rounded-2xl p-4">
                <div class="text-xs text-gray-400 mb-1">Main Balance</div>
                <div id="main-balance" class="text-lg font-mono font-bold">$0</div>
            </div>
            <div class="bg-zinc-900 border border-gray-800 rounded-2xl p-4">
                <div class="text-xs text-gray-400 mb-1">Investment Balance</div>
                <div id="investment-balance" class="text-lg font-mono font-bold text-emerald-400">$0</div>
            </div>
        </div>

        <!-- Invest Card -->
        <div class="bg-zinc-900 border border-gray-800 rounded-3xl p-6 mb-6">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-11 h-11 rounded-2xl bg-blue-500/15 flex items-center justify-center">
                    <i class="fas fa-chart-line text-blue-400"></i>
                </div>
                <div>
                    <h2 class="text-xl font-semibold">Invest in Crypto</h2>
                    <p class="text-sm text-gray-400">Money will be taken from Main Balance</p>
                </div>
            </div>

            <div class="mb-5">
                <label class="text-sm text-gray-400 mb-2 block">Select Cryptocurrency</label>
                <select id="invest-coin" class="w-full bg-zinc-950 border border-gray-700 rounded-2xl py-4 px-5 text-white">
                    <option value="">Select a coin...</option>
                    <option value="bitcoin">Bitcoin (BTC) — 18.4% APY</option>
                    <option value="ethereum">Ethereum (ETH) — 12.7% APY</option>
                    <option value="solana">Solana (SOL) — 9.8% APY</option>
                    <option value="cardano">Cardano (ADA) — 7.2% APY</option>
                    <option value="binancecoin">BNB — 8.5% APY</option>
                    <option value="polkadot">Polkadot (DOT) — 11.3% APY</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="text-sm text-gray-400 mb-2 block">Amount (USD)</label>
                <input id="invest-amount" type="number" min="50" placeholder="Min $50"
                       class="w-full bg-zinc-950 border border-gray-700 rounded-2xl py-4 px-5 text-white placeholder-gray-500">
            </div>

            <button id="invest-btn" onclick="submitInvestment()"
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-semibold flex items-center justify-center gap-3 disabled:opacity-60">
                <svg id="invest-spinner" class="hidden animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="invest-btn-text">Confirm Investment</span>
            </button>
        </div>

        <!-- Investment History with Redeem buttons -->
        <div class="bg-zinc-900 border border-gray-800 rounded-3xl p-6">
            <h3 class="text-lg font-semibold mb-1">Active Investments</h3>
            <p class="text-sm text-gray-400 mb-6">Click Redeem to move money back to Main Balance</p>
            <div id="invest-history"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="invest.html" class="bottom-nav-item active"><i class="fas fa-chart-bar"></i><span>Invest</span></a>
        <a href="deposit.html" class="bottom-nav-item"><i class="fas fa-arrow-down"></i><span>Deposit</span></a>
        <a href="withdraw.html" class="bottom-nav-item"><i class="fas fa-arrow-up"></i><span>Withdraw</span></a>
        <a href="account.html" class="bottom-nav-item"><i class="fas fa-user"></i><span>Account</span></a>
    </nav>

    <script>
        // ========== BALANCE SYSTEM ==========
        function getBalances() {
            const data = JSON.parse(localStorage.getItem('apexvolt_balances') || '{}');
            return {
                main: Number(data.main) || 0,
                investment: Number(data.investment) || 0
            };
        }
        function saveBalances(main, investment) {
            localStorage.setItem('apexvolt_balances', JSON.stringify({
                main: Number(main),
                investment: Number(investment)
            }));
        }

        let investHistory = JSON.parse(localStorage.getItem('apexvolt_investments') || '[]');

        function updateBalanceDisplay() {
            const b = getBalances();
            document.getElementById('main-balance').textContent = '$' + b.main.toLocaleString();
            document.getElementById('investment-balance').textContent = '$' + b.investment.toLocaleString();
        }

        function submitInvestment() {
            const coin = document.getElementById('invest-coin').value;
            const amount = parseFloat(document.getElementById('invest-amount').value);
            const btn = document.getElementById('invest-btn');
            const spinner = document.getElementById('invest-spinner');
            const btnText = document.getElementById('invest-btn-text');

            if (!coin) return alert('Please select a cryptocurrency');
            if (!amount || amount < 50) return alert('Minimum investment is $50');

            const balances = getBalances();
            if (amount > balances.main) {
                return alert('Insufficient Main Balance. Please deposit first.');
            }

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'Processing...';

            setTimeout(() => {
                const coinNames = {
                    bitcoin: 'Bitcoin (BTC)', ethereum: 'Ethereum (ETH)', solana: 'Solana (SOL)',
                    cardano: 'Cardano (ADA)', binancecoin: 'BNB', polkadot: 'Polkadot (DOT)'
                };
                const apyMap = {
                    bitcoin: '18.4%', ethereum: '12.7%', solana: '9.8%',
                    cardano: '7.2%', binancecoin: '8.5%', polkadot: '11.3%'
                };

                // Move money: Main → Investment
                balances.main -= amount;
                balances.investment += amount;
                saveBalances(balances.main, balances.investment);

                // Add to history
                investHistory.unshift({
                    id: Date.now(),
                    coin: coinNames[coin],
                    amount: amount,
                    apy: apyMap[coin],
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    status: 'Active'
                });
                localStorage.setItem('apexvolt_investments', JSON.stringify(investHistory));

                document.getElementById('invest-coin').value = '';
                document.getElementById('invest-amount').value = '';
                updateBalanceDisplay();
                renderInvestHistory();

                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'Confirm Investment';

                alert(`Successfully invested $${amount.toLocaleString()} in ${coinNames[coin]}!`);
            }, 1200);
        }

        function redeemInvestment(id) {
            const item = investHistory.find(i => i.id === id);
            if (!item) return;

            if (!confirm(`Redeem $${item.amount.toLocaleString()} from ${item.coin} back to Main Balance?`)) return;

            const balances = getBalances();

            // Move money: Investment → Main
            balances.investment -= item.amount;
            balances.main += item.amount;
            saveBalances(balances.main, balances.investment);

            // Remove from active investments
            investHistory = investHistory.filter(i => i.id !== id);
            localStorage.setItem('apexvolt_investments', JSON.stringify(investHistory));

            updateBalanceDisplay();
            renderInvestHistory();
            alert(`Successfully redeemed $${item.amount.toLocaleString()} to Main Balance!`);
        }

        function renderInvestHistory() {
            const container = document.getElementById('invest-history');
            if (investHistory.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500">
                    <i class="fas fa-inbox text-4xl mb-3 opacity-30"></i>
                    <p>No active investments</p>
                </div>`;
                return;
            }

            container.innerHTML = investHistory.map(item => `
                <div class="flex items-center justify-between py-4 border-b border-gray-800 last:border-0 gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="font-medium truncate">${item.coin}</div>
                        <div class="text-sm text-gray-400">${item.date} · ${item.apy} APY</div>
                    </div>
                    <div class="text-right">
                        <div class="font-mono font-semibold text-emerald-400">$${item.amount.toLocaleString()}</div>
                        <button onclick="redeemInvestment(${item.id})" 
                                class="mt-1 text-xs bg-orange-600 hover:bg-orange-500 px-3 py-1 rounded-full transition">
                            Redeem
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Init
        updateBalanceDisplay();
        renderInvestHistory();
    </script>
</body>
</html>
